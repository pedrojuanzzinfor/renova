const hero=()=>{const s=SLD[SL];return `<div class="ht"><div class="wm">Renova${ic('spark',40,2.2)}</div><h2>${s[0]}</h2><p>${s[1]}</p><button class="bt" onclick="go('${s[3]}')">${s[2]} ${ic('arr',16,2.2)}</button></div><div class="ha"><img src="${HERO}" alt="Araras com roupas em tons de rosa e lilás e uma bolsa rosa"></div><button class="ar l" aria-label="Slide anterior" onclick="sl(-1)">${ic('cl',22,2.4)}</button><button class="ar r" aria-label="Próximo slide" onclick="sl(1)">${ic('cr',22,2.4)}</button><div class="dots">${SLD.map((_,i)=>`<button aria-label="Slide ${i+1}" class="${i==SL?'on':''}" onclick="SL=${i};hr()"></button>`).join('')}</div>`};
const hr=()=>{const h=$('#hs');if(h)h.innerHTML=hero()},sl=d=>{SL=(SL+d+SLD.length)%SLD.length;hr()};
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(()=>{if((location.hash.slice(1)||'home')=='home'&&!document.hidden)sl(1)},6000);
const area=(t,x,b,k,g,c)=>`<div class="ar2 ${c}"><div class="aa">${ic(k,96,1.3)}</div><div><h3>${t}</h3><p>${x}</p><button class="bt" onclick="go('${g}')">${b} ${ic('arr',16,2.2)}</button></div></div>`;
const info=(t,h)=>`<div class="cd"><h2 style="font-family:'Baloo 2'">${t}</h2>${h}</div>`;
const V={
home(){return `<section class="hs" id="hs" aria-roledescription="carrossel">${hero()}</section><div class="cr">${CATS.map(c=>`<button class="ct" onclick="cf('${c[0]}')"><i>${ic(c[2],38,1.5)}</i>${c[1]}</button>`).join('')}<button class="ct" onclick="cf('')"><i>${ic('dots',38,1.5)}</i>Mais categorias</button></div><div class="a2">${area('Área de Compras','Encontre produtos incríveis<br>com preços que cabem no seu bolso!','Começar a comprar','bag','comprar','p')}${area('Área de Vendas','Anuncie seus produtos de forma simples,<br>rápida e segura!','Começar a vender','store','vender','v')}</div><div class="sh"><h2>Produtos em destaque</h2><a href="#comprar">Ver todos ${ic('arr',16,2.2)}</a></div><div class="gr">${DEMO.slice(0,6).map(card).join('')}</div>`},
comprar(){let l=all().filter(p=>(!CF||p.c==CF)&&(!Q||p.n.toLowerCase().includes(Q.toLowerCase())));if(SO)l.sort((a,b)=>SO=='a'?a.p-b.p:b.p-a.p);return `<div class="sh"><h2>${Q?'Resultados para “'+E(Q)+'”':CF?CATS.find(c=>c[0]==CF)[1]:'Todos os produtos'} <span class="tag">${l.length}</span></h2><select aria-label="Ordenar" onchange="SO=this.value;render()" style="border:1.5px solid var(--ln);border-radius:99px;padding:6px 14px;font:700 .9rem Quicksand"><option value="">Mais recentes</option><option value="a" ${SO=='a'?'selected':''}>Menor preço</option><option value="d" ${SO=='d'?'selected':''}>Maior preço</option></select></div><div class="chips"><button class="${CF?'':'on'}" onclick="cf('')">Todas</button>${CATS.map(c=>`<button class="${CF==c[0]?'on':''}" onclick="cf('${c[0]}')">${c[1]}</button>`).join('')}</div><div class="gr">${l.map(card).join('')||'<p>Nenhum produto encontrado. Tente outra busca ou categoria.</p>'}</div>`},
vender(){if(!U)return info('Área de Vendas','<p>Para anunciar seus produtos, entre na sua conta ou cadastre-se.</p><button class="bt" onclick="authM(\'in\')">Entrar</button> <button class="bt ol" onclick="authM(\'up\')">Cadastre-se</button>');const my=ITEMS.filter(i=>i.o==U.e);
return `<div class="cd"><h2 style="font-family:'Baloo 2'">Anunciar um produto</h2><form class="f" onsubmit="addItem(event)"><label>Nome do produto</label><input name="n" required maxlength="60"><label>Categoria</label><select name="c">${CATS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select><label>Preço (R$)</label><input name="p" type="number" min="1" step="0.01" required><label>Estado</label><select name="st"><option>Novo</option><option>Seminovo</option><option>Usado</option></select><label>Foto (opcional, até 600 KB)</label><input type="file" name="f" accept="image/*"><p><button class="bt">Publicar anúncio</button></p></form></div><div class="cd"><h3>Meus anúncios</h3>${my.map(i=>`<div class="row"><div class="im">${i.img?`<img src="${i.img}" alt="">`:ic('bag',28)}</div><div style="flex:1"><b>${E(i.n)}</b><div class="mu">${R(i.p)} · ${E(i.st)}</div></div><button class="bt ol sm" onclick="delItem('${i.id}')">Remover</button></div>`).join('')||'<p class="mu">Você ainda não publicou anúncios.</p>'}</div>`},
favoritos(){if(!U)return info('Meus favoritos','<p>Entre na sua conta para salvar e ver seus favoritos.</p><button class="bt" onclick="authM(\'in\')">Entrar</button>');const l=D.favs.map(find).filter(Boolean);return `<div class="sh"><h2>Meus favoritos</h2></div><div class="gr">${l.map(card).join('')||'<p>Nenhum favorito ainda. Toque no coração de um produto.</p>'}</div>`},
carrinho(){const l=D.cart.map(find).filter(Boolean),t=l.reduce((a,p)=>a+p.p,0);return `<div class="sh"><h2>Carrinho</h2></div><div class="cd">${l.map(p=>`<div class="row"><div class="im">${p.img?`<img src="${p.img}" alt="">`:ic(p.ic||'bag',28)}</div><div style="flex:1"><b>${E(p.n)}</b><div class="mu">${E(p.st)}</div></div><b>${R(p.p)}</b><button class="bt ol sm" onclick="D.cart=D.cart.filter(x=>x!='${p.id}');saveD();render()">Remover</button></div>`).join('')||'<p>Seu carrinho está vazio.</p>'}${l.length?`<p><b>Total: ${R(t)}</b><br><span class="mu">${t>=99?'Frete grátis aplicado.':'Faltam '+R(99-t)+' para o frete grátis.'}</span></p><button class="bt" onclick="checkout()">Finalizar compra</button>`:'<button class="bt" onclick="go(\'comprar\')">Ver produtos</button>'}</div>`},
sobre(){return info('Sobre a Renova','<p>A Renova é um bazar online para comprar, vender e dar nova vida a produtos. Esta é uma versão demonstrativa: pagamento, entrega e vendedores reais ainda não estão ativos.</p>')},
duvidas(){return info('Dúvidas',[['Como compro?','Adicione itens ao carrinho e finalize a compra. Nesta versão, o pagamento ainda não está disponível.'],['Como vendo?','Entre na sua conta, abra a aba Vender e publique seu anúncio. Ele fica salvo neste aparelho.'],['Os itens são reais?','Os itens com a etiqueta “demonstrativo” são exemplos. Anúncios criados por você aparecem com o seu nome.']].map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join(''))},
contato(){return info('Contato','<p>Canal de atendimento ainda não configurado nesta versão demonstrativa.</p>')}};
async function addItem(e){e.preventDefault();const f=new FormData(e.target),fl=f.get('f');let img=null;if(fl&&fl.size){if(fl.size>6e5)return toast('Imagem muito grande (máx. 600 KB).');img=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(fl)})}
ITEMS.unshift({id:'u'+Date.now(),n:f.get('n'),c:f.get('c'),p:+f.get('p'),st:f.get('st'),img,s:U.n,o:U.e,ic:'bag'});sv('rv_items',ITEMS);render();toast('Anúncio publicado!')}
function delItem(id){ITEMS=ITEMS.filter(i=>i.id!=id);sv('rv_items',ITEMS);D.cart=D.cart.filter(x=>x!=id);D.favs=D.favs.filter(x=>x!=id);saveD();render()}
function checkout(){if(!U)return authM('in',1);modal('<h3>Compra ainda não disponível</h3><p>Esta é uma versão demonstrativa: o pagamento e o envio ainda não foram implementados. Seu carrinho continua salvo.</p>')}
function render(){const v=location.hash.slice(1)||'home';$('#t1').innerHTML=ic('tag',20)+'Frete grátis em compras acima de R$ 99';$('#t2').innerHTML=ic('shield',20)+'Compra segura';$('#t3').innerHTML=ic('head',20)+'Atendimento 24h';$('#lgs').innerHTML=ic('spark',30,2);$('#sb').innerHTML=ic('search',22);
$('#ub').innerHTML=ic('user',32,1.5)+(U?`<span>Olá, ${E(U.n.split(' ')[0])}<br>Sair</span>`:'<span>Entrar<br>ou cadastrar</span>');$('#fb').innerHTML=ic('heart',32,1.5)+'<span>Meus<br>favoritos</span>';$('#cb').innerHTML=ic('cart',34,1.5)+`<span class="bd">${D.cart.length}</span>`;
$('#allc').innerHTML=ic('menu',20,2)+'Todas as categorias '+ic('dn',16,2.2);$('#dd').innerHTML=CATS.map(c=>`<button onclick="cf('${c[0]}')">${ic(c[2],20)} ${c[1]}</button>`).join('');
$('#nc').className=v=='home'||v=='comprar'?'on':'';$('#nvd').className=v=='vender'?'on':'';$('#m').innerHTML=(V[v]||V.home)()}
addEventListener('hashchange',render);render();
</script></body></html>
